name: cyber_mystery
display_name: 赛博诡秘
short_desc: 诡秘之主主题的人生重开模拟器：出身与天赋自由搭配，自动走完一段按年龄推进的诡秘短篇人生。
desc: 赛博诡秘 · 诡秘人生重开模拟器。选择出身与天赋开启一段诡秘世界的人生：随机事件流转，接触非凡组织，饮下魔药，以扮演法消化序列力量，从序列9一路爬升至序列0成神，或在疯狂与失控中化作雾中怪物。人生结果会将关键节点完整保留，并把晋升之间的扮演、危机、途径经历和普通事件按原始年龄逐条编排为更完整的第二人称短篇；序列9至5补足途径化晋升经历，所有晋升时的序列名称都会在纯文本与图卡中高亮。人生图卡压缩标题、统计与结尾区域，为正文释放空间，并始终保持一张超宽三栏图。序列4及之后拥有途径专属晋升场景，登神、吞噬相邻途径序列0、吞噬源质和外神终点坍缩使用不同终局叙事与图卡主题。支持 /诡秘 重开（捏人式开局）、/诡秘 天骄榜（本群排行榜）、/诡秘 途径（途径图鉴）。纯本地随机引擎，不调用 LLM。
